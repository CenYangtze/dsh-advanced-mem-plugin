# dsh-advanced-mem-plugin — the bundle layer this package contributes.
#
# Applied when a profile lists `dsh-advanced-mem-plugin` in `dsh.profile.bundles`.
# Rows are ordered as the data flows: the hub, its store and embedder, passive
# capture, the maintenance engine, then the two model-facing consumers. Cordis
# resolves injections itself, so this order is documentation rather than a
# dependency declaration.
#
# The store row needs `ctx.storage.domain`, which the `@deepseek-ai/dsh-web-app`
# bundle mounts (both shipped profiles stack it). Without that service the hub
# registers no store, `ctx.memory.ready` stays false, capture and recall skip,
# and the three tools fail loud — memory degrades instead of corrupting a turn.
#
# Every field below is deliberately explicit: the plugins declare no default for
# a retention policy, because the right half-life for a belief depends on how a
# deployment is used. Override any row from your profile's `cordis.patch.yml` by
# targeting its `id` — but restate every key, since a patch replaces a row's
# whole `config` rather than deep-merging it.
- insert:
    - id: memory
      name: dsh-advanced-mem-plugin
      config:
        recallLimit: 12
        profileLimit: 12
        inferredConfidence: 0.4
        assertedConfidence: 0.9
        # An inference unreinforced for 60 days is worth about half what it was.
        inferredHalfLifeMs: 5184000000
        # 0 disables erosion: the user said it, so only the user unsays it.
        assertedHalfLifeMs: 0
        reinforcementRate: 0.25
        contradictionRate: 0.5
        retirementFloor: 0.05
        activationHops: 2
        activationFalloff: 0.45
        recordBudget: 5000
        # Frequency emphasis lives in `profile` and `suggest`, not here. Swept on
        # KylinMem: 0.15 costs 19 points of rank-1 accuracy on a node-dense
        # corpus and 5 on a sparse one, because the rank curve is flat enough
        # that a 1.5x multiplier outweighs twenty places of lexical evidence.
        supportWeight: 0
        # Above this label overlap, a newly distilled belief reinforces the one
        # already held instead of sitting beside it as a synonym.
        duplicateThreshold: 0.8
        # And above this, a cue is dropped from a recall as a restatement of one
        # already selected — the budget is small, and spending all of it on one
        # claim crowds out everything else the turn needed.
        diversityThreshold: 0.7
        # No embedder is mounted below, so this is the weight a *real* one would
        # get. It is deliberately 1: the shipped feature-hash embedder is the
        # thing that had to be weighed down, not the seam.
        vectorWeight: 1

    - id: memory-store
      name: dsh-advanced-mem-plugin/store-domain

    # No embedding row. `embedding-hash` is FNV-1a feature hashing — a random
    # projection of token hashes with no semantics in it — so its cosine
    # similarity is a lossier restatement of the term overlap BM25 already has.
    # Measured on LoCoMo, LongMemEval and both halves of PerLTQA, fusing it at
    # equal weight cost up to 8.8 points of recall and 0.155 of MRR against not
    # fusing it at all, and every intermediate weight was worse than zero. Mount
    # a real embedder here and it gets `vectorWeight` above; mounting the hash
    # one means lowering that weight first.
    #
    #   - id: memory-embedding
    #     name: dsh-advanced-mem-plugin/embedding-hash
    #     config:
    #       dimensions: 512

    - id: memory-observer
      name: dsh-advanced-mem-plugin/observer
      config:
        captureUserMessages: true
        captureAssistantMessages: false
        captureToolCalls: true
        maxTextLength: 4000
        excludedTools: []
        # Under Code Mode the model calls one transport and drives every real
        # tool from inside the program, so the transport's own call says only
        # "a program ran". Capture the dispatches instead and skip the carrier.
        captureCodeDispatches: true
        transportTools: [run_code]
        # A label, not a transcript: enough to name the call, never its payload.
        maxToolDigestLength: 120

    - id: memory-consolidation
      name: dsh-advanced-mem-plugin/consolidation
      config:
        minObservations: 3
        observationSaturation: 6
        maxConfidence: 0.85
        minSequenceLength: 2
        maxSequenceLength: 4
        minSequenceRepeats: 3
        # A habit needs repeating before it is a belief; a request does not.
        # The user already said it once, in their own words.
        minStatements: 1
        minSubjectLength: 3
        maxSubjectLength: 60
        consolidateEveryTurns: 5
        sweepEveryTurns: 50

    - id: memory-recall
      name: dsh-advanced-mem-plugin/recall
      config:
        maxCues: 8
        minConfidence: 0.2
        injectProfileOnFirstTurn: true
        profileLimit: 10
        maxCharacters: 4000

    - id: tool-memory
      name: dsh-advanced-mem-plugin/tool
      config:
        defaultSearchLimit: 8
        maxSearchLimit: 25
        maxSummaryLength: 400

    # The one surface addressed to the person rather than the model: see what
    # was learned, what it suggests starting from, and delete what is wrong.
    - id: command-memory
      name: dsh-advanced-mem-plugin/command
      config:
        profileLimit: 20
        suggestLimit: 5
        searchLimit: 10
