# Local development settings only — a consumer installs this bundle into a dsh
# profile, whose own pnpm-workspace.yaml already carries these values.
#
# `autoInstallPeers: false` is the load-bearing one: every `@deepseek-ai/*` peer
# must come from the harness installation, not from a second copy pnpm fetched.
# Two cordis instances mean two service registries, and a plugin registered on
# one is invisible to the other.
packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false

# `tsdown` (the prepare-time build) pulls in esbuild, which has a postinstall
# build script. pnpm >=10 blocks those until allowed by name.
allowBuilds:
  esbuild: true
